// ─── Helpers: Time & Date ───
function getLocalDateString(d = new Date()) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function getTimeUntilMidnightString() {
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
  const diffMs = midnight - now;
  const hours = Math.floor(diffMs / (1000 * 60 * 60));
  const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
  return `${hours}h ${mins}m`;
}

function getUserDoneQuestsKey(userId) {
  let uid = userId;
  if (!uid) {
    try {

      }
    } catch (e) {
      uid = null;
    }
  }
  return `eq_done_quests_v4_${uid || 'guest_user'}`;
}

function getDoneQuests(userId) {
  if (typeof localStorage === 'undefined') return [];
  const key = getUserDoneQuestsKey(userId);
  const r = localStorage.getItem(key);
  if (!r) return [];
  try {
    const parsed = JSON.parse(r);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveDoneQuests(userId, qList) {
  if (typeof localStorage === 'undefined') return;
  const key = getUserDoneQuestsKey(userId);
  localStorage.setItem(key, JSON.stringify(qList));
}

function isQuestDoneForUser(q, doneQuests) {
  if (!doneQuests || !Array.isArray(doneQuests)) return false;
  const todayStr = getLocalDateString();

  const found = doneQuests.find(d => {
    if (typeof d === 'string') return d === q.id;
    return d.questId === q.id;
  });

  if (!found) return false;

  // Legacy string format
  if (typeof found === 'string') {
    return true;
  }

  // Daily quest is ONLY completed if completed TODAY! (Resets fresh every day)
  if (q.duration === 'Daily') {
    return found.date === todayStr;
  }

  // Weekly quest: completed if within last 7 days
  if (q.duration === 'Weekly') {
    const compDate = new Date(found.completedAt || found.date);
    const diffDays = (new Date().getTime() - compDate.getTime()) / (1000 * 3600 * 24);
    return diffDays < 7;
  }

  // Milestone / Special: permanently completed
  return true;
}

function calcCarbon(l) {
  const transport = Math.max(5, (l.carKm*52*0.21/12)+(l.bikeKm*52*0.09/12)+(l.busTr*4*0.75)+(l.metroTr*4*0.35));
  const electricity = l.kwh * 0.82;
  const food = l.diet==='vegan'?60:l.diet==='vegetarian'?95:140;
  const waste = l.segregates?20:35;
  const total = Math.round(transport+electricity+food+waste+35);
  return {
    total, yearly: (total*12/1000).toFixed(2),
    breakdown:[
      { name:'Transportation', amt:Math.round(transport), pct:Math.round((transport/total)*100), icon:'directions_car' },
      { name:'Electricity', amt:Math.round(electricity), pct:Math.round((electricity/total)*100), icon:'bolt' },
      { name:'Food & Diet', amt:Math.round(food), pct:Math.round((food/total)*100), icon:'restaurant' },
      { name:'Waste & Utilities', amt:Math.round(waste+35), pct:Math.round(((waste+35)/total)*100), icon:'delete' },
    ]
  };
}

  const top = res.breakdown[0];

    insight = '🚗 Your largest carbon hotspot is transportation. Switching 2 weekly private vehicle trips to Pune Metro or PMPML buses drops your footprint by ~25%.';
  } else if (top.name === 'Electricity') {
    insight = '⚡ Your highest emissions stem from household electricity consumption. Swapping standby devices and cold showers will have immediate impact.';
  } else if (top.name === 'Food & Diet') {
    insight = '🥗 Food emissions represent your top carbon category. Shifting 2 meals per week to plant-based choices reduces your footprint significantly.';
  } else {
    insight = '♻️ Waste management is your key focus area. Segregating wet organic and dry recyclable waste prevents municipal landfill methane.';
  }
  return { category: top.name, pct: top.pct, insight };
}

  if (top.name === 'Electricity') return { title: '⚡ Energy Saver', desc: 'Focused on reducing home standby power, HVAC energy, and water heating.' };
  if (top.name === 'Food & Diet') return { title: '🥗 Conscious Consumer', desc: 'Mindful about dietary emissions, local organic sourcing, and plant-based nutrition.' };
  return { title: '♻️ Waste Warrior', desc: 'Dedicated to wet/dry waste segregation, zero plastic, and composting.' };
}

function getAIQuestAlternatives(rejectedQuest) {
  const sameCat = QUESTS.filter(q => q.category === rejectedQuest.category && q.id !== rejectedQuest.id);
  if (sameCat.length >= 2) return sameCat.slice(0, 2);
  const others = QUESTS.filter(q => q.id !== rejectedQuest.id);
  return [...sameCat, ...others].slice(0, 2);
}

function getAIVisionVerification(quest) {
  const confidence = Math.floor(Math.random() * 8) + 92; // 92-99%
  let objects = ['Sustainable Eco Action', 'Pune Geotag Detected'];
  if (quest.category === 'transportation') objects = ['Public Transit Corridor', 'Metro/PMPML E-Ticket', 'GPS Trace'];
  else if (quest.category === 'electricity') objects = ['Energy Efficient Appliance', 'Power Standby Off', 'Verified Meter Reading'];
  else if (quest.category === 'waste') objects = ['Wet Organic Bin', 'Dry Recyclable Bin', 'Segregated Waste'];
  else if (quest.category === 'greenery') objects = ['Native Sapling', 'Balcony Flora', 'Water Container', 'Pune Soil'];
  else if (quest.category === 'food') objects = ['Plant-Based Meal', 'Local Farm Produce', 'Zero Single-Use Packaging'];
  else if (quest.category === 'shopping') objects = ['Cloth Tote Bag', 'Reusable Container', 'Eco Packaging'];

  return {
    confidence,
    objects,
    message: `AI Vision Confidence: ${confidence}% — Verified authentic proof detected ✓`
  };
}

// ─── Real-Time Daily Streak Engine ───
function syncRealtimeStreak(user) {
  if (!user) return user;

  const todayStr = getLocalDateString();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = getLocalDateString(yesterday);

  let currentStreak = user.streak || 0;
  const lastActive = user.lastActiveDate || null;

  if (lastActive) {
    if (lastActive === todayStr) {
      // Completed action today -> streak is active and intact
    } else if (lastActive === yesterdayStr) {
      // Completed action yesterday -> streak is preserved awaiting today's completion
    } else {
      // Inactive for 2 or more days -> streak resets to 0 until new activity today
      currentStreak = 0;
    }
  }

  return {
    ...user,
    streak: currentStreak
  };
}

function computeNextStreakOnCompletion(user) {
  const todayStr = getLocalDateString();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = getLocalDateString(yesterday);

  let newStreak = user.streak || 0;
  const lastActive = user.lastActiveDate;

  if (!lastActive) {
    newStreak = 1;
  } else if (lastActive === todayStr) {
    newStreak = Math.max(1, newStreak);
  } else if (lastActive === yesterdayStr) {
    newStreak = newStreak + 1;
  } else {
    newStreak = 1;
  }

  return {
    streak: newStreak,
    lastActiveDate: todayStr
  };
}

      `:''}

      ${step===3?`
        <div class="fade-up">
          <div class="mono" style="font-size:11px;color:#6bfb9a;margin-bottom:8px">STEP 3 OF 4 • LIFESTYLE SURVEY</div>
          <h2 style="font-size:24px;font-weight:800;color:#fff;margin-bottom:8px">Lifestyle Assessment</h2>
          <p style="font-size:14px;color:#bccabb;margin-bottom:20px">Calculates baseline monthly emissions across 5 categories.</p>
          
          <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:28px">
            <div class="glass" style="padding:16px">
              <div style="font-weight:700;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:6px">🚗 Transportation</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div><label>CAR KM/WK</label><input type="number" value="${l.carKm}" onchange="state.lifestyle.carKm=+this.value"/></div>
                <div><label>BIKE KM/WK</label><input type="number" value="${l.bikeKm}" onchange="state.lifestyle.bikeKm=+this.value"/></div>

                <div><label>METRO TRIPS/WK</label><input type="number" value="${l.metroTr}" onchange="state.lifestyle.metroTr=+this.value"/></div>
              </div>
            </div>
            <div class="glass" style="padding:16px">
              <div style="font-weight:700;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:6px">⚡ Electricity</div>
              <div><label>MONTHLY KWH CONSUMPTION</label><input type="number" value="${l.kwh}" onchange="state.lifestyle.kwh=+this.value"/></div>
            </div>
          </div>

          <div style="display:flex;gap:12px">
            <button class="btn btn-ghost" style="flex:1" onclick="state.onboardingStep=2;render()">← Back</button>
            <button class="btn btn-primary" style="flex:2" onclick="finishLifestyle()">Calculate Footprint →</button>
          </div>
        </div>
      `:''}

      ${step===4?`
        <div class="fade-up" style="text-align:center">
          <div class="mono" style="font-size:11px;color:#6bfb9a;margin-bottom:8px">STEP 4 OF 4 • BASELINE RESULT</div>
          <h2 style="font-size:36px;font-weight:900;color:#fff;margin-bottom:6px">${calcCarbon(l).total} kg CO₂e/mo</h2>
          <p style="font-size:14px;color:#bccabb;margin-bottom:24px">Yearly footprint: <strong style="color:#fff">${calcCarbon(l).yearly} tonnes CO₂e</strong></p>
          
          <div class="glass" style="padding:20px;margin-bottom:24px;text-align:left">
            <div class="mono" style="font-size:11px;color:#ffd23f;margin-bottom:4px">AI GREEN PERSONA</div>
            <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:6px">🚗 Carbon Challenger</div>
            <p style="font-size:13px;color:#bccabb;margin:0">Transportation is your highest carbon contributor. Completing public commute quests will drop your footprint by up to 25%!</p>
          </div>

          <button class="btn btn-primary" style="width:100%;font-size:16px" onclick="navigate('/dashboard')">Enter EcoQuest Dashboard →</button>
        </div>
      `:''}
    </div>
  `;
}

function validateStep1Next() {
  if (!state.lifestyle || !state.lifestyle.ageGroup) {
    alert('⚠️ Please select an Age Profile (Gen Z, Adult, Senior, or Youth) to continue.');
    return;
  }
  state.onboardingStep = 2;
  render();
}

function validateStep2Next() {
  if (!state.user || !state.user.ward) {
    alert('⚠️ Please select your Pune Ward / Neighborhood to continue.');
    return;
  }
  state.onboardingStep = 3;
  render();
}

function finishLifestyle() {
  saveLifestyle(state.lifestyle);
  const r = calcCarbon(state.lifestyle);
  let persona = 'Eco Beginner';
  if(r.breakdown[0].name==='Transportation') persona = 'Carbon Challenger';
  updateUser({ ...state.user, persona });
  state.onboardingStep = 4;
  render();
}

    const availableDaily = dailyQuests.filter(q => !isQuestDoneForUser(q, state.doneQuests));

        <!-- Today's Fresh Daily Quests Showcase -->
        <div>

              <div style="display:flex;align-items:center;gap:8px">

        <!-- AI Weekly Sustainability Report Widget -->
        <div class="glass" style="padding:24px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">

              <div style="font-size:13px;color:#bccabb;margin-bottom:6px">⭐ <strong>${u.xp}</strong> EcoXP earned</div>

            </div>
            <div>
              <div style="font-size:13px;color:#bccabb;margin-bottom:6px">🌿 Estimated impact: <strong>${u.co2Avoided} kg CO₂e</strong> avoided</div>

    const durationFilter = state.questFilterDuration || 'all';
    const catFilter = state.questFilterCategory || 'all';
    const statusFilter = state.questFilterStatus || 'all';

    const dailyQuests = QUESTS.filter(q => q.duration === 'Daily');
    const weeklyQuests = QUESTS.filter(q => q.duration === 'Weekly');
    const specialQuests = QUESTS.filter(q => q.duration === 'Special');

    const dailyAvailableCount = dailyQuests.filter(q => !isQuestDoneForUser(q, state.doneQuests)).length;
    const allAvailableCount = QUESTS.filter(q => !isQuestDoneForUser(q, state.doneQuests)).length;
    const completedCount = QUESTS.filter(q => isQuestDoneForUser(q, state.doneQuests)).length;

    const filtered = QUESTS.filter(q => {
      if (durationFilter !== 'all' && q.duration !== durationFilter) return false;
      if (catFilter !== 'all' && q.category !== catFilter) return false;
      const isDone = isQuestDoneForUser(q, state.doneQuests);
      if (statusFilter === 'available' && isDone) return false;
      if (statusFilter === 'completed' && !isDone) return false;
      return true;
    });

    return `
      <div>
        <!-- Quest Hub Top Banner -->
        <div class="glass-glow" style="padding:24px 28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
          <div>

                ✕ Reset Filters

        <!-- Quests Grid -->
        ${filtered.length === 0 ? `
          <div class="glass" style="padding:48px 24px;text-align:center">
            <span class="material-symbols-outlined" style="font-size:48px;color:#bccabb;margin-bottom:12px">search_off</span>

              class="btn btn-primary" style="font-size:13px;padding:10px 24px">

        ` : `
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px">
            ${filtered.map(q => renderQuestCard(q)).join('')}
          </div>
        `}
      </div>
    `;
  }

  if (path === '/progress') {
    return `
      <div>
        <h1 style="font-size:28px;font-weight:800;color:#fff;margin-bottom:8px">Eco Journey Progression Tree</h1>

  if (path === '/leaderboard') {
    const dbUsers = getDB();
    const realList = dbUsers.map(userRec => ({
      id: userRec.id,
      name: userRec.name,
      ward: userRec.ward || 'Kothrud',
      xp: userRec.xp || 0,
      level: userRec.level || 1,
      levelTitle: userRec.levelTitle || 'Eco Seedling',

function openQuestModal(qId) {
  state.uploadedProof = null;
  state.activeQuestModal = QUESTS.find(q=>q.id===qId);
  render();
}

function handleQuestProofFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const u = state.user || {};
    const wardName = u.ward || 'Kothrud';
    
    state.uploadedProof = {
      dataUrl: evt.target.result,
      filename: file.name,
      size: (file.size / 1024).toFixed(1) + ' KB',
      geotag: `18.5204° N, 73.8567° E (${wardName}, Pune)`,
      hash: 'SHA256_' + Math.random().toString(36).substring(2, 10).toUpperCase(),
      verified: true,
      aiConfidence: 96
    };
    render();
  };
  reader.readAsDataURL(file);
}

        <h3 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:6px">${q.title}</h3>
        <p style="font-size:13px;color:#bccabb;margin-bottom:14px;line-height:1.5">${q.desc}</p>
        
        <div style="background:rgba(107,251,154,0.05);border:1px solid rgba(107,251,154,0.15);border-radius:12px;padding:12px;margin-bottom:14px">
          <div class="mono" style="font-size:11px;color:#6bfb9a;margin-bottom:2px">REQUIRED TASK PROOF</div>
          <div style="font-size:12px;color:#fff">${q.proof}</div>
        </div>

        <!-- Image Upload & Geotag Verification Section -->
        <div style="background:rgba(255,255,255,0.03);border:2px dashed ${state.uploadedProof ? '#6bfb9a' : 'rgba(107,251,154,0.3)'};border-radius:14px;padding:16px;text-align:center;margin-bottom:14px">
          ${state.uploadedProof ? `
            <div style="margin-bottom:10px">
              <img src="${state.uploadedProof.dataUrl}" style="max-height:130px;border-radius:10px;border:2px solid #6bfb9a;object-fit:cover"/>
            </div>
            <div style="font-size:12px;color:#6bfb9a;font-weight:700;margin-bottom:2px" class="mono">🟢 EcoGuard Geotag & Image Verification Passed</div>
            <div style="font-size:11px;color:#bccabb;margin-bottom:6px">📍 ${state.uploadedProof.geotag} • Hash: ${state.uploadedProof.hash}</div>
            <button type="button" class="btn btn-ghost" style="font-size:11px;padding:4px 12px;color:#f87171" onclick="state.uploadedProof=null;render()">Remove & Replace Photo</button>
          ` : `
            <span class="material-symbols-outlined" style="font-size:32px;color:#6bfb9a;margin-bottom:4px">cloud_upload</span>
            <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:2px">Upload Proof Photo / Geotagged Image</div>
            <div style="font-size:11px;color:#bccabb;margin-bottom:10px">Select image file from device for EcoGuard AI verification</div>
            <input type="file" id="quest-file-input" accept="image/*" onchange="handleQuestProofFile(event)" style="display:none"/>
            <button type="button" class="btn btn-ghost" style="font-size:12px;padding:8px 18px" onclick="document.getElementById('quest-file-input').click()">
              📷 Select Proof Image...
            </button>
          `}
        </div>

        <!-- AI Vision Object Detection Analysis Box -->
        <div style="background:rgba(168,85,247,0.06);border:1px solid rgba(168,85,247,0.25);border-radius:14px;padding:12px;margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span class="mono" style="font-size:11px;color:#c084fc">🤖 AI VISION ANALYSIS ENGINE</span>
            <span class="chip chip-purple" style="font-size:10px">${vision.confidence}% Confidence</span>
          </div>
          <div style="font-size:12px;color:#bccabb;margin-bottom:6px">${vision.message}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${vision.objects.map(obj => `<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(168,85,247,0.15);color:#c084fc" class="mono">✓ ${obj}</span>`).join('')}
          </div>
        </div>

        <button class="btn btn-primary" style="width:100%;font-size:14px" onclick="confirmQuestCompletion('${q.id}')">
          ✓ Submit Verified Proof & Claim ${q.xp} XP
        </button>
      </div>
    </div>
  `;
}

function confirmQuestCompletion(qId) {
  const q = QUESTS.find(item=>item.id===qId);
  if(!q) return;

  if (!state.uploadedProof) {
    alert('⚠️ EcoGuard Protection: Please upload a proof photo or geotagged image of your task before submitting!');
    return;
  }

  const u = state.user;
  const oldLvl = getLevelInfo(u.xp);
  const newXP = u.xp + q.xp;
  const newLvl = getLevelInfo(newXP);

  const streakData = computeNextStreakOnCompletion(u);

  const updated = {
    ...u,
    xp: newXP,
    level: newLvl.level,
    levelTitle: newLvl.title,
    streak: streakData.streak,
    lastActiveDate: streakData.lastActiveDate,
    completedCount: (u.completedCount || 0) + 1,
    co2Avoided: parseFloat(((u.co2Avoided || 0) + q.co2).toFixed(1))
  };

  const todayStr = getLocalDateString();
  const completionRecord = {
    questId: qId,
    completedAt: new Date().toISOString(),
    date: todayStr,
    duration: q.duration || 'Daily'
  };

  state.doneQuests = state.doneQuests.filter(d => (typeof d === 'string' ? d !== qId : d.questId !== qId));
  state.doneQuests.push(completionRecord);
  saveDoneQuests(u.id, state.doneQuests);

  state.activeQuestModal = null;
  state.uploadedProof = null;
  updateUser(updated);

  if (newLvl.level > oldLvl.level) {
    state.levelUpModal = newLvl;
    render();
  }
}

function renderLevelUpModal() {
  const lvl = state.levelUpModal;
  return `
    <div class="modal-overlay">
      <div class="glass-glow" style="width:100%;max-width:380px;padding:40px;text-align:center">
        <div style="font-size:56px;margin-bottom:16px">🎉</div>
        <div class="mono" style="font-size:12px;color:#ffd23f;margin-bottom:8px">LEVEL UP!</div>
        <h2 style="font-size:28px;font-weight:900;color:#fff;margin-bottom:8px">${lvl.title}</h2>
        <p style="font-size:14px;color:#bccabb;margin-bottom:24px">You've reached <strong style="color:#ffd23f">Level ${lvl.level}</strong>!</p>
        <button class="btn btn-primary" style="width:100%" onclick="state.levelUpModal=null;render()">Awesome! Continue Quests →</button>
      </div>
    </div>
  `;
}

function selectProfileAvatar(url) {
  if(!url) return;
  state.user.avatar = url;
  const input = document.getElementById('prof-avatar');
  if(input) input.value = url;
  render();
}

function handleSaveFullProfile(e) {
  e.preventDefault();
  const name = document.getElementById('prof-name').value.trim();
  const ward = document.getElementById('prof-ward').value;
  const avatar = document.getElementById('prof-avatar').value.trim() || state.user.avatar;
  const ageGroup = document.getElementById('prof-ageGroup').value;

  const carKm = Math.max(0, +document.getElementById('prof-carKm').value || 0);
  const bikeKm = Math.max(0, +document.getElementById('prof-bikeKm').value || 0);
  const busTr = Math.max(0, +document.getElementById('prof-busTr').value || 0);
  const metroTr = Math.max(0, +document.getElementById('prof-metroTr').value || 0);
  const kwh = Math.max(0, +document.getElementById('prof-kwh').value || 0);
  const diet = document.getElementById('prof-diet').value;

  state.lifestyle = { ...state.lifestyle, carKm, bikeKm, busTr, metroTr, kwh, diet, ageGroup };
  saveLifestyle(state.lifestyle);

  const res = calcCarbon(state.lifestyle);
  const personaInfo = getAIGreenPersona(res, state.user?.completedCount || 0);

  const updatedUser = {
    ...state.user,
    name,
    ward,
    avatar,
    persona: personaInfo.title
  };

  updateUser(updatedUser);
  alert('✨ Profile & Lifestyle baseline updated successfully!');
}

function handleCantDoQuest(qId) {
  const rejected = QUESTS.find(q => q.id === qId);
  if (!rejected) return;
  const alternatives = getAIQuestAlternatives(rejected);
  state.cantDoModal = { rejected, alternatives };
  render();
}

function renderCantDoModal() {
  const { rejected, alternatives } = state.cantDoModal;
  return `
    <div class="modal-overlay" onclick="if(event.target===this){state.cantDoModal=null;render();}">
      <div class="glass-glow" style="width:100%;max-width:480px;padding:32px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span class="material-symbols-outlined" style="color:#ffd23f">auto_awesome</span>
          <span class="mono" style="font-size:12px;color:#ffd23f">AI QUEST PERSONALIZATION ADAPTOR</span>
        </div>
        <h3 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:6px">No problem! Quest Adapted</h3>
        <p style="font-size:13px;color:#bccabb;margin-bottom:20px">Since <strong>"${rejected.title}"</strong> isn't convenient right now, our AI engine selected these personalized alternative eco-actions:</p>

        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px">
          ${alternatives.map(alt => `
            <div class="glass" style="padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
              <div>
                <div style="font-weight:700;color:#fff;font-size:14px;margin-bottom:3px">${alt.title}</div>
                <div style="font-size:12px;color:#bccabb">${alt.desc}</div>
                <div style="display:flex;gap:6px;margin-top:6px">
                  <span class="chip chip-gold" style="font-size:10px">+${alt.xp} XP</span>
                  <span class="chip chip-green" style="font-size:10px">-${alt.co2} kg CO₂</span>
                </div>
              </div>
              <button class="btn btn-primary" style="font-size:12px;padding:8px 14px;flex-shrink:0" onclick="state.cantDoModal=null;openQuestModal('${alt.id}')">
                Accept This →
              </button>
            </div>
          `).join('')}
        </div>

        <button class="btn btn-ghost" style="width:100%" onclick="state.cantDoModal=null;render()">Close</button>
      </div>
    </div>
  `;
}

function renderAIChatButton() {
  return `

      <div style="padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.3);border-radius:20px 20px 0 0">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="material-symbols-outlined" style="color:#6bfb9a">smart_toy</span>
          <span style="font-weight:800;color:#fff;font-size:15px">EcoQuest AI Assistant</span>
        </div>
        <button onclick="state.aiChatOpen=false;render()" style="background:none;border:none;color:#bccabb;cursor:pointer">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div id="chat-body" style="flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px">
        ${state.chatMessages.map(msg => `
          <div style="align-self:${msg.sender==='user'?'flex-end':'flex-start'};max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;
            background:${msg.sender==='user'?'#6bfb9a':'rgba(255,255,255,0.06)'};

// Initial Render
render();
</script>
